:root{--cream:#fbf6ed;--paper:#fffdf8;--red:#a91f32;--red2:#c63b48;--gold:#c99b2e;--ink:#29242a;--muted:#756b68;--navy:#17243d;--line:#eadbc8;--green:#23845b;--blue:#326eb2;--shadow:0 12px 32px #4c2b1710}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI",sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--red);color:white;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover,.btn:hover{filter:brightness(1.06)}button.secondary,.btn.secondary{background:#efe4d5;color:#5b3032}button.gold{background:var(--gold);color:#241d11}button.danger{background:#9f2630}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;gap:14px;justify-content:space-between;background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:13px 18px;box-shadow:var(--shadow);margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:60px;height:60px;object-fit:contain;border-radius:50%}.brand h1{font-size:clamp(19px,3vw,28px);color:var(--red);margin:0;line-height:1.2}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.sidebar{background:var(--navy);color:white;border-radius:18px;padding:14px;height:max-content;position:sticky;top:12px}.sidebar a{display:block;padding:11px 12px;border-radius:10px;color:#e9edf7;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#293d60;color:white}.sidebar a.admin-only{color:#f2d78c}.content{min-width:0}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}.page-title h2{margin:0;color:var(--red);font-size:clamp(22px,3vw,30px)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.card{background:var(--paper);border:1px s er-card p{margin:4px 0;color:var(--muted)}.chat-box{background:#f8f9fb;border:1px solid var(--line);border-radius:15px;padding:14px;min-height:300px;max-height:55vh;overflow:auto}.message{max-width:80%;padding:10px 13px;margin:10px 0;border-radius:14px;background:#e2edff;border:1px solid #cbdcf8}.message.mine{margin-left:auto;background:#dff5e4;border-color:#c2e7cc}.message strong{display:block;font-size:12px;color:#4c5360}.message p{margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message time{font-size:11px;color:#67717b}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.gallery-item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.gallery-item img,.gallery-item video{width:100%;height:180px;object-fit:cover;background:#eee}.gallery-item .meta{padding:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.profile-head{text-align:center;padding:25px}.profile-head .avatar{width:110px;height:110px;font-size:30px;margin-bottom:12px}.profile-head h2{margin:0;color:var(--red)}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv div{padding:12px;background:#fbf3e8;border-radius:10px}.kv small{display:block;color:var(--muted)}.kv strong{overflow-wrap:anywhere}.footer{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}.login-shell{max-width:510px;margin:32px auto}.login-logo{text-align:center;margin-bottom:18px}.login-logo img{width:130px;height:130px;object-fit:contain}.login-logo h1{margin:0;color:var(--red);font-size:34px}.login-logo p{color:var(--muted);margin:5px}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.divider{height:1px;background:var(--line);margin:14px 0}.file-preview{max-width:180px;max-height:140px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:white;padding:4px}.mobile-menu{display:none}
