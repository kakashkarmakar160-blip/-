<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>দুর্গা সমিতি</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
:root{--cream:#fbf6ed;--paper:#fffdf9;--red:#a9162b;--red2:#c42c40;--gold:#d7a52b;--navy:#101d39;--blue:#1e3764;--ink:#28251f;--muted:#77736b;--line:#eadfce;--green:#17784c;--danger:#b42332;--shadow:0 12px 32px #4b2b1412}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:white;font-weight:700}button:hover{filter:brightness(1.05)}button.secondary{background:#f2e7d6;color:#5e342c;border:1px solid var(--line)}button.dark{background:var(--navy)}button.danger{background:#fff0f0;color:#a3162b;border:1px solid #f0c8cd}button.small{padding:6px 9px;font-size:13px}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:12px}.wrap{max-width:1200px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:68px;object-fit:contain;border-radius:50%;background:white}.brand h1{font-size:clamp(22px,4vw,34px);margin:0;color:var(--red);font-weight:800}.brand p{margin:3px 0 0;color:#876a39;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 0 20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.login-layout{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 5%,#fff 0,#fbf4e8 55%,#f4e7d5 100%)}.login-card{width:min(100%,470px);padding:28px}.login-card .brand{justify-content:center;flex-direction:column;text-align:center}.login-card .brand img{width:104px;height:104px}.login-card h2{text-align:center;margin:24px 0 8px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700;font-size:14px}.field input,.field select,.field textarea,input.search,select.inline{width:100%;padding:11px 12px;border:1px solid #d9cbb7;border-radius:10px;background:#fff;color:#28251f;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d7a52b22}.login-card button[type=submit]{width:100%;padding:13px}.notice{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:14px}.notice.error{background:#fff0f0;color:#a3162b;border:1px solid #f0c8cd}.notice.success{background:#edf9f1;color:#176a43;border:1px solid #c8e8d3}.notice.info{background:#f0f4ff;color:#243e75;border:1px solid #d8e0fb}.demo-box{margin-top:18px;background:#fff7e9;border:1px dashed #d7b15a;border-radius:12px;padding:12px;font-size:13px}.app{min-height:100vh}.apphead{background:var(--navy);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.apphead .brand h1{color:#fff}.apphead .brand p{color:#e8cc80}.apphead .brand img{width:54px;height:54px}.apphead button{background:#253e6d}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;max-width:1450px;margin:auto;padding:18px}.sidebar{background:var(--navy);color:white;border-radius:18px;padding:14px;height:max-content;position:sticky;top:12px}.sidebar button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#e9eef8;border:1px solid transparent}.sidebar button.active,.sidebar button:hover{background:#263e6c;border-color:#43629a}.sidebar .admin-tag{font-size:12px;color:#e6c86d;padding:8px}.content{min-width:0}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}.page-title h2{margin:0;color:var(--navy);font-size:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{border-radius:15px;padding:16px;color:white;background:linear-gradient(135deg,#203c70,#101d39);box-shadow:var(--shadow)}.stat:nth-child(2){background:linear-gradient(135deg,#17784c,#0d5535)}.stat:nth-child(3){background:linear-gradient(135deg,#a9162b,#731125)}.stat:nth-child(4){background:linear-gradient(135deg,#bd8a18,#8a5e08)}.stat span{font-size:13px;opacity:.9}.stat strong{display:block;font-size:26px;margin-top:6px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eee5d8;font-size:13px;vertical-align:middle}th{background:#f4ead9;color:#5c3c27;white-space:nowrap}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;background:#edf9f1;color:#176a43}.pill.off{background:#fff0f0;color:#a3162b}.rowtools{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px}.profile-head{text-align:center;padding:25px}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#f4e8d6}.profile-head h2{color:var(--red);margin:12px 0 5px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:12px;background:#fff8ef;border-radius:10px;border:1px solid var(--line)}.detail b{display:block;font-size:12px;color:#876a39;margin-bottom:5px}.chatbox{height:55vh;min-height:300px;overflow:auto;background:#f6f0e7;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:10px 12px;border-radius:14px;background:white;align-self:flex-start;box-shadow:0 2px 5px #0000000a}.bubble.mine{align-self:flex-end;background:#d9f4d7}.bubble small{display:block;color:#777;font-size:11px;margin-top:5px}.bubble .modtools{margin-top:7px;display:flex;gap:5px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gallery-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white}.gallery-item img{width:100%;height:160px;object-fit:cover;background:#f4ead9}.gallery-item .caption{padding:10px}.money{font-variant-numeric:tabular-nums}.empty{padding:26px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.footer{text-align:center;padding:22px;color:#8b8173;font-size:12px}.filepreview{max-width:100%;max-height:150px;object-fit:contain}.menu-mobile{display:none}.linkbtn{background:none;color:var(--red);padding:0;text-decoration:underline}.checkrow{display:flex;gap:8px;align-items:center}.checkrow input{width:auto}.export-area{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f0e7;border-radius:10px;padding:10px;font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{position:static;display:flex;overflow:auto;gap:5px;padding:8px}.sidebar button{white-space:nowrap;width:auto;margin:0}.sidebar .admin-tag{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.settings-grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.apphead{padding:12px}.apphead .brand img{width:44px;height:44px}}@media(max-width:480px){.wrap{padding:12px}.login-card{padding:20px}.brand img{width:54px;height:54px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.gallery{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}.page-title h2{font-size:20px}.apphead .brand p{display:none}.card{padding:14px}}
</style>

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&Array.isArray(x.members)&&x.settings)return x}catch(e){}return clone(seed)}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function loadSession(){try{return JSON.parse(sessionStorage.getItem(SESSION)||"null")}catch(e){return null}}
function saveSession(m){session={id:m.id,name:m.name,admin:!!m.admin};sessionStorage.setItem(SESSION,JSON.stringify(session))}
function clearSession(){session=null;sessionStorage.removeItem(SESSION);settingsUnlocked=false}
function norm(s){return String(s??"").normalize("NFC").trim().replace(/\s+/g," ").toLocaleLowerCase("bn")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function date(s){if(!s)return "—";try{return new Date(s).toLocaleDateString("bn-IN")}catch(e){return s}}
function current(){return db.members.find(m=>m.id===session?.id)}
function isAdmin(){return !!current()?.admin}
function pageTitle(t,sub=""){return `<div class="page-title"><div><h2>${esc(t)}</h2>${sub?`<div class="muted tiny">${esc(sub)}</div>`:""}</div></div>`}
function card(title,body,extra=""){return `<section class="card"><div class="page-title"><h3>${title}</h3>${extra}</div>${body}</section>`}
function notice(text,type="info"){return `<div class="notice ${type}">${esc(text)}</div>`}

function tableTransactions(list){if(!list.length)return '<div class="empty">কোনো হিসাব নেই</div>';return `<div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>ধরন</th><th>টাকা</th></tr></thead><tbody>${list.map(t=>`<tr><td>${date(t.date)}</td><td>${esc(t.item||t.description)}</td><td>${esc(t.direction==="income"?"আয়":"খরচ")}</td><td class="money">${money(t.amount)}</td></tr>`).join("")}</tbody></table></div>`}

function membersTable(list){return `<div class="table-wrap"><table><thead><tr><th>ছবি</th><th>নাম</th><th>সদস্য ID</th><th>জন্মতারিখ</th><th>দায়িত্ব</th><th>চাঁদা</th><th>অবস্থা</th><th>অ্যাকশন</th></tr></thead><tbody>${list.map(m=>`<tr><td><img class="avatar" style="width:38px;height:38px" src="${m.photo||LOGO}" alt=""></td><td><button class="linkbtn" data-profile="${esc(m.id)}">${esc(m.name)}</button></td><td>${esc(m.id)}</td><td>${date(m.dob)}</td><td>${esc(m.role||"সদস্য")}</td><td>${money(m.dues)}</td><td><span class="pill ${m.active===false?"off":""}">${m.active===false?"নিষ্ক্রিয়":"সক্রিয়"}</span></td><td><div class="rowtools"><button class="small secondary" data-profile="${esc(m.id)}">প্রোফাইল</button>${isAdmin()?`<button class="small secondary" data-edit-member="${esc(m.id)}">এডিট</button><button class="small ${m.active===false?"":"danger"}" data-toggle-member="${esc(m.id)}">${m.active===false?"সক্রিয় করুন":"নিষ্ক্রিয়"}</button>`:""}</div></td></tr>`).join("")||'<tr><td colspan="8">কোনো সদস্য পাওয়া যায়নি</td></tr>'}</tbody></table></div>`}

function renderProfile(id){const m=db.members.find(x=>x.id===id)||current();return pageTitle("সদস্য প্রোফাইল") + `<section class="card profile-head"><img class="avatar" src="${m.photo||LOGO}" alt=""><h2>${esc(m.name)}</h2><span class="pill ${m.active===false?"off":""}">${m.active===false?"নিষ্ক্রিয়":"সক্রিয়"}</span></section><br><section class="card"><div class="detailgrid">${[["নাম",m.name],["সদস্য ID",m.id],["জন্মতারিখ",date(m.dob)],["ঠিকানা",m.address||"তথ্য দেওয়া হয়নি"],["দায়িত্ব",m.role||"সদস্য"],["চাঁদা",money(m.dues)]].map(([a,b])=>`<div class="detail"><b>${a}</b>${esc(b)}</div>`).join("")}</div>${isAdmin()?`<br><button data-edit-member="${esc(m.id)}">প্রোফাইল সম্পাদনা</button>`:""}</section>`}

function renderBills(){let years=[...new Set([...db.years,...db.transactions.map(t=>Number(t.year))])].sort((a,b)=>b-a);return pageTitle("বিল, চাঁদা ও অনুদান","বছরভিত্তিক আর্থিক হিসাব") + `<div class="toolbar"><label>বছর নির্বাচন</label><select id="yearSelect" class="inline">${years.map(y=>`<option>${y}</option>`).join("")}</select>${isAdmin()?'<button data-action="addTransaction">+ হিসাব যোগ</button>':""}</div><div id="billSummary"></div><div id="transactionTable"></div><div id="transactionFormHolder"></div>`}
function renderReports(){let income=db.transactions.filter(t=>t.direction==="income").reduce((a,t)=>a+Number(t.amount||0),0),expense=db.transactions.filter(t=>t.direction==="expense").reduce((a,t)=>a+Number(t.amount||0),0);return pageTitle("আর্থিক রিপোর্ট","সকল সংরক্ষিত ডেমো হিসাব") + `<div class="stats"><div class="stat"><span>মোট আয়</span><strong>${money(income)}</strong></div><div class="stat"><span>মোট খরচ</span><strong>${money(expense)}</strong></div><div class="stat"><span>অবশিষ্ট</span><strong>${money(income-expense)}</strong></div><div class="stat"><span>রেকর্ড</span><strong>${db.transactions.length}</strong></div></div>${card("রিপোর্ট এক্সপোর্ট",'<div class="rowtools"><button data-action="exportCSV">CSV ডাউনলোড</button><button class="secondary" data-action="exportJSON">JSON ডাউনলোড</button></div>')}${card("সব হিসাব",tableTransactions(db.transactions.slice().reverse()))}`}
function renderSettings(){return pageTitle("অ্যাডমিন সেটিংস","নাম, লোগো, সদস্য, গ্যালারি ও হিসাব পরিচালনা") + (!settingsUnlocked?`<section class="card" style="max-width:520px"><div class="notice info">সেটিংস খোলার আগে আলাদা পাসওয়ার্ড দিন।</div><form id="settingsGate"><div class="field"><label>সেটিংস পাসওয়ার্ড</label><input id="settingsPass" type="password" required></div><button>যাচাই করুন</button></form><div id="settingsError"></div></section>`:`<div class="settings-grid"><section class="card"><h3>সমিতির পরিচিতি</h3><form id="siteSettingsForm"><div class="field"><label>সমিতির নাম</label><input name="name" value="${esc(db.settings.name)}" required></div><div class="field"><label>মূলমন্ত্র</label><input name="motto" value="${esc(db.settings.motto)}"></div><div class="field"><label>ফুটারের লেখা</label><input name="footer" value="${esc(db.settings.footer)}"></div><div class="field"><label>লোগো ফাইল</label><input type="file" id="logoUpload" accept="image/*"><img id="logoPreview" class="filepreview" src="${db.settings.logo||LOGO}"></div><button>পরিচিতি সংরক্ষণ</button></form></section><section class="card"><h3>সদস্য ব্যবস্থাপনা</h3><p>মোট সদস্য: <b>${db.members.length}</b></p><button data-jump="members">সদস্য যোগ/সম্পাদনা</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>নতুন কাস্টম ফিল্ড</h3><form id="customFieldForm"><div class="field"><label>ফিল্ডের নাম</label><input name="name" required placeholder="যেমন মোবাইল নম্বর"></div><div class="field"><label>ধরন</label><select name="type"><option value="text">টেক্সট</option><option value="number">সংখ্যা</option><option value="date">তারিখ</option></select></div><button>ফিল্ড যোগ করুন</button></form><p class="tiny muted">কাস্টম ফিল্ডের সংজ্ঞা Local Storage-এ রাখা হবে।</p></section><section class="card"><h3>গ্যালারি</h3><button data-jump="gallery">গ্যালারি পরিচালনা</button><p class="tiny muted">নতুন ফাইল গ্যালারি পেজ থেকে যোগ করা যাবে।</p></section><section class="card"><h3>আর্থিক হিসাব</h3><button data-jump="bills">বিল ও চাঁদা পরিচালনা</button></section><section class="card"><h3>সেটিংস পাসওয়ার্ড</h3><form id="changeSettingsPass"><div class="field"><label>নতুন সেটিংস পাসওয়ার্ড</label><input name="pass" required minlength="6"></div><button>পাসওয়ার্ড পরিবর্তন</button></form></section></div>`)}
function renderBackup(){return pageTitle("ডেটা ব্যাকআপ","Local Storage ডেটা JSON হিসেবে সংরক্ষণ বা পুনরুদ্ধার") + `<section class="card"><div class="rowtools"><button data-action="exportJSON">JSON এক্সপোর্ট</button><button class="secondary" data-action="resetDemo">ডেমো ডেটা রিসেট</button></div><div class="field"><label>JSON ফাইল ইমপোর্ট</label><input id="importJSON" type="file" accept=".json,application/json"></div><p class="tiny muted">ডেটা এই ব্রাউজারে থাকে; অন্য ডিভাইসে স্বয়ংক্রিয়ভাবে শেয়ার হয় না।</p></section>`}
function bindPage(){
root.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{activePage=b.dataset.jump;renderApp()});
root.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{selectedMemberId=b.dataset.profile;activePage="profile";renderApp()});
root.querySelectorAll("[data-edit-member]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;const m=db.members.find(x=>x.id===b.dataset.editMember);activePage="members";renderApp();document.getElementById("memberFormHolder").innerHTML=memberForm(m);bindMemberForm(m)});
root.querySelectorAll("[data-toggle-member]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;let m=db.members.find(x=>x.id===b.dataset.toggleMember);if(m){m.active=m.active===false;saveDB();renderApp()}});
const search=document.getElementById("memberSearch");if(search)search.oninput=()=>{const q=norm(search.value);document.getElementById("membersTable").innerHTML=membersTable(db.members.filter(m=>norm(m.name).includes(q)||norm(m.id).includes(q)));bindPage()};
const mf=document.getElementById("memberForm");if(mf)bindMemberForm();
const sf=document.getElementById("settingsGate");if(sf)sf.onsubmit=e=>{e.preventDefault();if(document.getElementById("settingsPass").value===SETTINGS_PASS){settingsUnlocked=true;renderPage()}else document.getElementById("settingsError").innerHTML=notice("সেটিংস পাসওয়ার্ড ভুল","error")};
const sitef=document.getElementById("siteSettingsForm");if(sitef)sitef.onsubmit=async e=>{e.preventDefault();const f=new FormData(sitef);db.settings.name=f.get("name");db.settings.motto=f.get("motto");db.settings.footer=f.get("footer");const file=document.getElementById("logoUpload").files[0];if(file){if(file.size>1500000){alert("লোগো ফাইল ১.৫ MB-এর মধ্যে রাখুন");return}db.settings.logo=await fileToData(file)}saveDB();renderApp()};
const logoInput=document.getElementById("logoUpload");if(logoInput)logoInput.onchange=async()=>{const file=logoInput.files[0];if(file)document.getElementById("logoPreview").src=await fileToData(file)};
const cff=document.getElementById("customFieldForm");if(cff)cff.onsubmit=e=>{e.preventDefault();const f=new FormData(cff);db.customFields.push({name:f.get("name"),type:f.get("type"),section:"member",required:false});saveDB();renderApp()};
const cpf=document.getElementById("changeSettingsPass");if(cpf)cpf.onsubmit=e=>{e.preventDefault();alert("ডেমোতে সেটিংস পাসওয়ার্ড বর্তমান সেশনের জন্য পরিবর্তন সমর্থিত নয়। বাস্তব ব্যবহারে সার্ভার-সাইড ব্যবস্থা দরকার।")};
const chat=document.getElementById("chatForm");if(chat)chat.onsubmit=e=>{e.preventDefault();const v=document.getElementById("chatInput").value.trim();if(!v)return;db.messages.push({id:Date.now(),memberId:current().id,name:current().name,text:v,time:new Date().toISOString()});saveDB();renderPage();const box=document.getElementById("chatbox");if(box)box.scrollTop=box.scrollHeight};
root.querySelectorAll("[data-delete-message]").forEach(b=>b.onclick=()=>{if(isAdmin()&&confirm("এই মেসেজ মুছবেন?")){db.messages=db.messages.filter(m=>m.id!==Number(b.dataset.deleteMessage));saveDB();renderPage()}});
root.querySelectorAll("[data-edit-message]").forEach(b=>b.onclick=()=>{if(!isAdmin())return;const m=db.messages.find(x=>x.id===Number(b.dataset.editMessage));const v=prompt("মেসেজ সম্পাদনা",m?.text||"");if(m&&v!==null){m.text=v;saveDB();renderPage()}});
root.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>handleAction(b.dataset.action));
root.querySelectorAll("[data-delete-gallery]").forEach(b=>b.onclick=()=>{if(isAdmin()&&confirm("ফাইলটি মুছবেন?")){db.gallery=db.gallery.filter(g=>g.id!==Number(b.dataset.deleteGallery));saveDB();renderPage()}});
const ys=document.getElementById("yearSelect");if(ys){const selected=localStorage.getItem("durga_selected_year")||String(new Date().getFullYear());if([...ys.options].some(o=>o.value===selected))ys.value=selected;const update=()=>{localStorage.setItem("durga_selected_year",ys.value);const tx=db.transactions.filter(t=>Number(t.year)===Number(ys.value));const inc=tx.filter(t=>t.direction==="income").reduce((a,t)=>a+Number(t.amount||0),0),out=tx.filter(t=>t.direction==="expense").reduce((a,t)=>a+Number(t.amount||0),0);document.getElementById("billSummary").innerHTML=`<div class="stats"><div class="stat"><span>মোট আয়</span><strong>${money(inc)}</strong></div><div class="stat"><span>মোট খরচ</span><strong>${money(out)}</strong></div><div class="stat"><span>অবশিষ্ট</span><strong>${money(inc-out)}</strong></div><div class="stat"><span>রেকর্ড</span><strong>${tx.length}</strong></div></div>`;document.getElementById("transactionTable").innerHTML=tableTransactions(tx)};ys.onchange=update;update()}
const imp=document.getElementById("importJSON");if(imp)imp.onchange=async()=>{const f=imp.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.settings||!Array.isArray(obj.members))throw Error("invalid");if(confirm("বর্তমান ডেমো ডেটা বদলে JSON ডেটা ইমপোর্ট করবেন?")){db=obj;saveDB();renderApp()}}catch(e){alert("JSON ফাইলটি সঠিক নয়।")}};
}
function bindMemberForm(existing=null){const form=document.getElementById("memberForm");if(!form)return;form.onsubmit=e=>{e.preventDefault();if(!isAdmin())return;const f=new FormData(form);const data={name:String(f.get("name")).trim(),id:String(f.get("id")).trim(),password:String(f.get("password")),dob:f.get("dob"),role:f.get("role"),dues:Number(f.get("dues")||0),address:f.get("address"),photo:f.get("photo"),active:existing?existing.active!==false:true,admin:existing?!!existing.admin:false};if(!data.name||!data.id)return;if(!existing&&db.members.some(m=>m.id.toLowerCase()===data.id.toLowerCase())){alert("এই সদস্য ID আগে থেকেই আছে");return}if(existing)Object.assign(existing,data);else db.members.push(data);saveDB();renderApp()}}
function handleAction(action){
if(action==="addMember"){if(!isAdmin())return;document.getElementById("memberFormHolder").innerHTML=memberForm();bindMemberForm();document.getElementById("memberFormHolder").scrollIntoView({behavior:"smooth"})}
if(action==="cancelMemberForm"){document.getElementById("memberFormHolder").innerHTML=""}
if(action==="addGallery"){if(!isAdmin())return;document.getElementById("galleryFormHolder").innerHTML=`<section class="card" style="margin-top:15px"><h3>গ্যালারিতে ফাইল যোগ</h3><form id="galleryForm"><div class="field"><label>ফাইলের নাম</label><input name="name" required></div><div class="field"><label>বিবরণ</label><input name="description"></div><div class="field"><label>ছবি নির্বাচন</label><input name="file" type="file" accept="image/*" required></div><button>আপলোড</button></form></section>`;document.getElementById("galleryForm").onsubmit=async e=>{e.preventDefault();const file=e.target.file.files[0];if(!file)return;if(file.size>1500000){alert("ডেমোতে ফাইল ১.৫ MB-এর মধ্যে রাখুন");return}db.gallery.push({id:Date.now(),name:e.target.name.value,description:e.target.description.value,type:"image",src:await fileToData(file),visible:true});saveDB();renderApp()}}
if(action==="addTransaction"){if(!isAdmin())return;document.getElementById("transactionFormHolder").innerHTML=`<section class="card" style="margin-top:15px"><h3>নতুন আর্থিক হিসাব</h3><form id="txForm"><div class="settings-grid"><div class="field"><label>তারিখ</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ধরন</label><select name="direction"><option value="income">আয়</option><option value="expense">খরচ</option></select></div><div class="field"><label>হিসাবের খাত</label><input name="type" required placeholder="চাঁদা/অনুদান/খরচ"></div><div class="field"><label>টাকার পরিমাণ</label><input type="number" min="0" name="amount" required></div><div class="field"><label>কে দিয়েছেন/নিয়েছেন</label><input name="person"></div><div class="field"><label>বিবরণ</label><input name="item" required></div><div class="field"><label>দায়িত্বপ্রাপ্ত</label><input name="responsible"></div></div><button>হিসাব সংরক্ষণ</button></form></section>`;document.getElementById("txForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),d=String(f.get("date"));db.transactions.push({id:Date.now(),date:d,year:Number(d.slice(0,4)),type:f.get("type"),direction:f.get("direction"),amount:Number(f.get("amount")),person:f.get("person"),item:f.get("item"),responsible:f.get("responsible")});if(!db.years.includes(Number(d.slice(0,4))))db.years.push(Number(d.slice(0,4)));saveDB();renderApp()}}
if(action==="exportJSON"){download("durga-samiti-data.json",JSON.stringify(db,null,2),"application/json")}
if(action==="exportCSV"){const rows=[["তারিখ","বছর","ধরন","দিক","টাকা","ব্যক্তি","বিবরণ"],...db.transactions.map(t=>[t.date,t.year,t.type,t.direction,t.amount,t.person,t.item])];download("durga-samiti-report.csv",rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv;charset=utf-8")}
if(action==="resetDemo"){if(!isAdmin()){alert("শুধু অ্যাডমিন করতে পারবেন");return}if(confirm("সতর্কতা: সব স্থানীয় ডেমো পরিবর্তন মুছে যাবে। নিশ্চিত?")&&confirm("শেষবার নিশ্চিত করুন—ডেটা রিসেট করবেন?")){db=clone(seed);saveDB();renderApp()}}
}
function download(name,content,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
if(!localStorage.getItem(KEY))saveDB();
if(session&&current()){renderApp()}else{clearSession();renderLogin()}
})();
</script>
</body>
</html>
